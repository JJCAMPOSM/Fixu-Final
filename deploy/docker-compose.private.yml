# Se ejecuta en el SERVIDOR PRIVADO (solo IP privada, ver DEPLOY_RUBRICA.md).
# Publica los servicios en la IP privada del servidor para que el Nginx del
# servidor público (docker-compose.public.yml) pueda alcanzarlos.
#
# Uso: docker compose -f deploy/docker-compose.private.yml up -d --build
# Ejecutar desde la raíz del repo.
#
# IMPORTANTE: todos los puertos de abajo se bindean explícitamente a
# PRIVATE_IP (la IP privada de este mismo droplet, no 0.0.0.0). Si se
# publican sin IP (ej. "5432:5432"), Docker inserta sus propias reglas
# iptables que se evalúan ANTES que las de UFW, así que UFW podría "negar"
# el puerto y aun así quedar alcanzable desde la IP pública de este
# servidor. Definir PRIVATE_IP en deploy/.env (ver DEPLOY_RUBRICA.md).

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: fixu
      POSTGRES_USER: fixu_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria, definila en deploy/.env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${PRIVATE_IP:-10.116.0.3}:5432:5432"   # Bind a IP privada, no 0.0.0.0 (ver nota arriba)

  redis:
    image: redis:alpine
    restart: always
    ports:
      - "${PRIVATE_IP:-10.116.0.3}:6379:6379"   # Bind a IP privada, no 0.0.0.0

  flask_app_1: &flask_app
    build:
      context: ..
      dockerfile: flask_app.Dockerfile
    restart: always
    depends_on: [db, redis]
    environment: &flask_env
      DATABASE_URL: postgresql://fixu_user:${DB_PASSWORD:?DB_PASSWORD es obligatoria, definila en deploy/.env}@db:5432/fixu
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatoria, definila en deploy/.env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY es obligatoria, definila en deploy/.env}
      FIXU_BOOTSTRAP_DB: "1"
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:?HMAC_SECRET_KEY es obligatoria, definila en deploy/.env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY es obligatoria, definila en deploy/.env}
      LARAVEL_ADMIN_URL: http://laravel_admin:80
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://167.172.144.30}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SESSION_COOKIE_SECURE: "1"
    volumes:
      - uploads-data:/app/fixu/static/uploads
    ports:
      - "${PRIVATE_IP:-10.116.0.3}:5001:5000"

  flask_app_2:
    <<: *flask_app
    environment:
      <<: *flask_env
      FIXU_BOOTSTRAP_DB: "0"
    ports:
      - "${PRIVATE_IP:-10.116.0.3}:5002:5000"

  laravel_admin:
    build:
      context: ..
      dockerfile: laravel_admin.Dockerfile
    restart: always
    depends_on: [db]
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: fixu
      DB_USERNAME: fixu_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria, definila en deploy/.env}
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:?HMAC_SECRET_KEY es obligatoria, definila en deploy/.env}
    ports:
      - "${PRIVATE_IP:-10.116.0.3}:8000:80"

  bridge_api_1: &bridge_api
    build:
      context: ../bridge_api
      dockerfile: ../bridge_api.Dockerfile
    restart: always
    depends_on: [db, redis, flask_app_1, laravel_admin]
    environment: &bridge_env
      FLASK_APP_URL: http://flask_app_1:5000
      LARAVEL_ADMIN_URL: http://laravel_admin:80
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY es obligatoria, definila en deploy/.env}
      DATABASE_URL: postgresql://fixu_user:${DB_PASSWORD:?DB_PASSWORD es obligatoria, definila en deploy/.env}@db:5432/fixu
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:?HMAC_SECRET_KEY es obligatoria, definila en deploy/.env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    ports:
      - "${PRIVATE_IP:-10.116.0.3}:8001:8000"

  bridge_api_2:
    <<: *bridge_api
    environment:
      <<: *bridge_env
      FLASK_APP_URL: http://flask_app_2:5000
    ports:
      - "${PRIVATE_IP:-10.116.0.3}:8002:8000"

volumes:
  db-data:
  uploads-data:

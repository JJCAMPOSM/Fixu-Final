global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'nginx_exporter'
    static_configs:
      - targets: ['nginx_exporter:9113']

  - job_name: 'flask_app'
    metrics_path: /api/metrics
    static_configs:
      - targets: ['flask_app_1:5000', 'flask_app_2:5000']

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    client_max_body_size 8m;

    # Réplicas del backend web (Flask) — balanceo round-robin
    upstream flask_backend {
        server flask_app_1:5000;
        server flask_app_2:5000;
    }

    # Réplicas de la API pública para App Móvil (FastAPI) — balanceo round-robin
    upstream bridge_backend {
        server bridge_api_1:8000;
        server bridge_api_2:8000;
    }

    upstream laravel_backend {
        server laravel_admin:80;
    }

    upstream grafana_backend {
        server grafana:3000;
    }

    # ---- Puerto 80/443: Tráfico Web (Flask + Laravel Admin) ----
    server {
        listen 80;
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/ssl/fixu.crt;
        ssl_certificate_key /etc/nginx/ssl/fixu.key;

        location /admin/ {
            proxy_pass http://laravel_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /grafana/ {
            proxy_pass http://grafana_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location / {
            proxy_pass http://flask_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---- Puerto 8080: API HTTP pública para App Móvil (bridge_api con JWT) ----
    server {
        listen 8080;
        server_name _;

        location / {
            proxy_pass http://bridge_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }

    # ---- Puerto 8404: Panel de estadísticas de Nginx ----
    server {
        listen 8404;
        server_name _;

        location /nginx_status {
            stub_status on;
            access_log off;
        }

        location / {
            return 200 'Fixu - Nginx stats en /nginx_status\n';
            add_header Content-Type text/plain;
        }
    }
}

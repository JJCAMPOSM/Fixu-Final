services:
  # ---------------- Red Privada (sin puertos publicados al host) ----------------
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: fixu
      POSTGRES_USER: fixu_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria, definila en .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - private_net

  redis:
    image: redis:alpine
    restart: always
    networks:
      - private_net
    # Sin puertos expuestos al host: solo accesible en la red privada

  flask_app_1: &flask_app
    build:
      context: .
      dockerfile: flask_app.Dockerfile
    restart: always
    depends_on:
      - db
      - redis
    environment: &flask_env
      DATABASE_URL: postgresql://fixu_user:${DB_PASSWORD:?DB_PASSWORD es obligatoria, definila en .env}@db:5432/fixu
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY es obligatoria, definila en .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY es obligatoria, definila en .env}
      FIXU_BOOTSTRAP_DB: "1"
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:?HMAC_SECRET_KEY es obligatoria, definila en .env}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY es obligatoria, definila en .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY es obligatoria, definila en .env}
      LARAVEL_ADMIN_URL: http://laravel_admin:80
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://167.172.144.30}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    volumes:
      - uploads-data:/app/fixu/uploads
    networks:
      - private_net

  flask_app_2:
    <<: *flask_app
    environment:
      <<: *flask_env
      FIXU_BOOTSTRAP_DB: "0"  # solo la réplica 1 hace bootstrap inicial

  laravel_admin:
    build:
      context: .
      dockerfile: laravel_admin.Dockerfile
    restart: always
    depends_on:
      - db
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: fixu
      DB_USERNAME: fixu_user
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD es obligatoria, definila en .env}
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:?HMAC_SECRET_KEY es obligatoria, definila en .env}
    networks:
      - private_net

  bridge_api_1: &bridge_api
    build:
      context: ./bridge_api
      dockerfile: ../bridge_api.Dockerfile
    restart: always
    depends_on:
      - db
      - redis
      - flask_app_1
      - laravel_admin
    environment: &bridge_env
      FLASK_APP_URL: http://flask_app_1:5000
      LARAVEL_ADMIN_URL: http://laravel_admin:80
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:?INTERNAL_API_KEY es obligatoria, definila en .env}
      DATABASE_URL: postgresql://fixu_user:${DB_PASSWORD:?DB_PASSWORD es obligatoria, definila en .env}@db:5432/fixu
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:?HMAC_SECRET_KEY es obligatoria, definila en .env}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
    networks:
      - private_net

  bridge_api_2:
    <<: *bridge_api
    environment:
      <<: *bridge_env
      FLASK_APP_URL: http://flask_app_2:5000

  # ---------------- Servidor Público / DMZ ----------------
  nginx:
    image: nginx:alpine
    restart: always
    depends_on:
      - flask_app_1
      - flask_app_2
      - bridge_api_1
      - bridge_api_2
      - laravel_admin
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
      - "8404:8404"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deploy/ssl:/etc/nginx/ssl:ro
    networks:
      - private_net
      - public_net

  nginx_exporter:
    image: nginx/nginx-prometheus-exporter:1.1
    restart: always
    command: ["--nginx.scrape-uri=http://nginx:8404/nginx_status"]
    depends_on:
      - nginx
    networks:
      - private_net
    # Sin puertos publicados: solo lo consume Prometheus por la red privada

  prometheus:
    image: prom/prometheus:latest
    restart: always
    ports:
      - "8405:9090"   # Único puerto de métricas autorizado por la rúbrica
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - private_net
      - public_net

  grafana:
    image: grafana/grafana:latest
    restart: always
    environment:
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
    depends_on:
      - prometheus
    networks:
      - private_net
    # Sin puerto publicado directo: se accede vía Nginx en /grafana (puerto 80/443)

networks:
  private_net:
    driver: bridge
    internal: false
  public_net:
    driver: bridge

volumes:
  db-data:
  uploads-data:

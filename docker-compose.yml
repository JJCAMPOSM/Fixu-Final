services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: fixu
      POSTGRES_USER: fixu_user
      POSTGRES_PASSWORD: fixu_password
    volumes:
      - db-data:/var/lib/postgresql/data

  flask_app:
    build:
      context: .
      dockerfile: flask_app.Dockerfile
    restart: always
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql://fixu_user:fixu_password@db:5432/fixu
      SECRET_KEY: dev-secret-change-me
      FIXU_BOOTSTRAP_DB: "1"
      HMAC_SECRET_KEY: internal-hmac-secret-key
    ports:
      - "5000:5000"

  laravel_admin:
    build:
      context: .
      dockerfile: laravel_admin.Dockerfile
    restart: always
    depends_on:
      - db
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
      DB_DATABASE: fixu
      DB_USERNAME: fixu_user
      DB_PASSWORD: fixu_password
    ports:
      - "8000:80"

  bridge_api:
    build:
      context: ./bridge_api
      dockerfile: ../bridge_api.Dockerfile
    restart: always
    depends_on:
      - db
      - flask_app
      - laravel_admin
    environment:
      FLASK_APP_URL: http://flask_app:5000
      LARAVEL_ADMIN_URL: http://laravel_admin:80
      INTERNAL_API_KEY: internal-bridge-secret-key
      DATABASE_URL: postgresql://fixu_user:fixu_password@db:5432/fixu
      HMAC_SECRET_KEY: internal-hmac-secret-key
    volumes:
      - ./bridge_api:/app

volumes:
  db-data:

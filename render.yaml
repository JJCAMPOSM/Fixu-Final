databases:
  - name: fixu-db
    databaseName: fixu
    user: fixu_user
    plan: free

services:
  - type: web
    name: fixu-flask-app
    env: docker
    dockerfilePath: ./flask_app.Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fixu-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: FIXU_BOOTSTRAP_DB
        value: "1"

  - type: web
    name: fixu-laravel-admin
    env: docker
    dockerfilePath: ./laravel_admin.Dockerfile
    envVars:
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: fixu-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: fixu-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: fixu-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: fixu-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: fixu-db
          property: password
      - key: APP_KEY
        generateValue: true

  - type: web
    name: fixu-bridge-api
    env: docker
    dockerContext: ./bridge_api
    dockerfilePath: ./bridge_api.Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: fixu-db
          property: connectionString
      - key: INTERNAL_API_KEY
        generateValue: true
      - key: FLASK_APP_URL
        fromService:
          type: web
          name: fixu-flask-app
          property: host
      - key: LARAVEL_ADMIN_URL
        fromService:
          type: web
          name: fixu-laravel-admin
          property: host
